<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Accel Business – Go digital in one sitting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>

:root:not([data-theme="light"]){}

:root[data-theme="dark"]{--bg:#0d1819;--surface:#16282a;--ink:#e8f0ef;--muted:#9bb0b2;--line:#294244;--brand:#37b99b;--brand-ink:#062a22;--accent:#f4b73a;--ok:#6fd49c;--warn:#f2b45c;--bad:#ff8f86;--okbg:#14352a;--warnbg:#3a2d10;--badbg:#3f1b18;--chip:#1f3638;--shadow:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
header small{color:var(--muted);display:block;font-size:13px;line-height:1.2}
.lang{display:flex;gap:4px}.lang button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-weight:600}
.lang button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{flex:1;padding:8px 16px 96px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:none;padding:6px 2px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
nav button .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800}
nav button.on{color:var(--brand)}nav button.on .dot{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
nav button.done .dot{border-color:var(--ok);color:var(--ok)}
h2{font-size:24px;line-height:1.15;margin:10px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;margin:8px 0;white-space:pre-wrap}
.bot{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.me{background:var(--brand);color:var(--brand-ink);margin-left:auto;border-top-right-radius:4px}

.chip:hover{background:var(--chip)}.chip.sel:hover{background:var(--brand)}
.txt{display:flex;gap:8px;margin-top:10px}.txt input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}

.btn.sm{width:auto;padding:9px 14px}.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item b{display:block}.item small{color:var(--muted);display:block;line-height:1.3}
.price{font-weight:800;white-space:nowrap}
.tog{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog:checked{background:var(--brand)}.tog:checked::after{left:21px}.tog:disabled{opacity:.5}
.tog:focus-visible,.chip:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.total{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px;position:sticky;top:6px;z-index:3}
.total .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.total small{opacity:.85}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:600}.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 8px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.find{border-radius:10px;padding:10px 12px;margin:8px 0}.find.BLOCK{background:var(--badbg)}.find.REVIEW{background:var(--warnbg)}.find.INFO{background:var(--chip)}.find.PASS{background:var(--okbg)}
.find b{display:block}.find small{display:block;color:var(--muted)}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:13px}
.doc img{width:100%;height:120px;object-fit:cover;object-position:top;display:block;background:var(--chip)}
.doc div{padding:6px 8px}.doc .miss{height:120px;display:grid;place-items:center;color:var(--bad);font-weight:700;background:var(--badbg)}
.kv{font-size:13px;color:var(--muted);word-break:break-word}.kv b{color:var(--ink);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.tl{position:relative;margin:14px 0 4px 8px}
.step{display:flex;gap:14px;padding-bottom:22px;position:relative}
.step::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}.step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.pin{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;z-index:1}
.step.done .pin{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.step.now .pin{border-color:var(--accent);background:var(--accent);color:#2b1d00;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 28%,transparent)}
.step b{display:block;line-height:1.2}.step small{color:var(--muted)}
.step.todo{opacity:.7}
.wa{background:#dcf8c6;color:#14301a;border-radius:12px;padding:10px 12px;font-size:14.5px;border-top-left-radius:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#1d4a32;color:#e6f6ea}}
input[type=range]{width:100%;accent-color:var(--brand)}
.consent label{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.consent input{margin-top:6px;accent-color:var(--brand);width:18px;height:18px}
.k{font-size:13px;color:var(--muted)}
.hide{display:none!important}
select{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<header><div><h1 id="ttl">Accel Business</h1><small id="tag"></small></div>
<div class="lang"><button data-l="en" class="on">EN</button><button data-l="hi">हिं</button></div></header>
<main id="main"></main>

<script id="DATA" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('DATA').textContent);
const CAT={};D.catalogue.forEach(r=>{r.tiers=r.available_city_tiers.split(';').map(Number);r.need_one=r.requires_one_of?r.requires_one_of.split('|'):[];['price_min_inr_per_month','price_max_inr_per_month','one_time_setup_inr','min_contract_months','min_employees','min_sites','typical_install_days'].forEach(k=>r[k]=+r[k]);CAT[r.product_id]=r});
const GST=new Map(D.gst.map(r=>[r[0],{legal:r[1],trade:r[2],addr:r[3],status:r[4]}]));
const UDY=new Map(D.udyam.map(r=>[r[0],{name:r[1],city:r[2]}]));
const TODAY=new Date('2026-07-15T00:00:00Z');
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
/* ---------- i18n ---------- */
const T={en:{tag:'Everything your business needs, in one sitting',n1:'Advisor',n2:'Quote',n3:'KYC',n4:'Track',n5:'Team',
 q_type:'Namaste! I am your Accel Business advisor. What kind of business do you run?',q_emp:'How many people work with you (including you)?',q_sites:'How many locations do you have?',q_tier:'Where is your business?',q_gst:'Do you have a GST registration?',q_net:'What internet do you use today?',q_need:'What do you need? Tap all that apply, then press Done.',q_sims:'How many business SIMs do you need?',
 done:'Done',yes:'Yes',no:'No',typeHere:'Or type your answer…',send:'Send',rec:'Here is what I recommend',why:'Why this fits',cantAdd:'Not available for you right now',seeQuote:'See my quote',restart:'Start again',
 mo:'/month',gst18:'GST @18%',total:'Total per month',setup:'One-time setup',contract:'Contract',months:'months',first:'First bill',addons:'Add more (price updates instantly)',core:'Your bundle',goKyc:'Looks good – verify my business',saving:'Longer contract = lower price',install:'Installation in about',days:'days'},
hi:{tag:'आपके बिज़नेस की ज़रूरत, एक ही बार में',n1:'सलाहकार',n2:'कोटेशन',n3:'केवाईसी',n4:'ट्रैक',n5:'टीम',
 q_type:'नमस्ते! मैं आपका Accel Business सलाहकार हूँ। आप किस तरह का बिज़नेस चलाते हैं?',q_emp:'आपके साथ कितने लोग काम करते हैं (आपको मिलाकर)?',q_sites:'आपकी कितनी जगहों पर दुकान/दफ़्तर है?',q_tier:'आपका बिज़नेस कहाँ है?',q_gst:'क्या आपके पास GST रजिस्ट्रेशन है?',q_net:'अभी आप कौन सा इंटरनेट इस्तेमाल करते हैं?',q_need:'आपको क्या चाहिए? जो चाहिए सब चुनें, फिर "हो गया" दबाएँ।',q_sims:'आपको कितने बिज़नेस सिम चाहिए?',
 done:'हो गया',yes:'हाँ',no:'नहीं',typeHere:'या अपना जवाब लिखें…',send:'भेजें',rec:'मेरी सलाह यह है',why:'यह क्यों सही है',cantAdd:'अभी आपके लिए उपलब्ध नहीं',seeQuote:'मेरा कोटेशन देखें',restart:'दोबारा शुरू करें',
 mo:'/माह',gst18:'GST @18%',total:'हर महीने कुल',setup:'एक बार का सेटअप',contract:'कॉन्ट्रैक्ट',months:'महीने',first:'पहला बिल',addons:'और जोड़ें (कीमत तुरंत बदलेगी)',core:'आपका बंडल',goKyc:'ठीक है – मेरा बिज़नेस वेरिफ़ाई करें',saving:'लंबा कॉन्ट्रैक्ट = कम कीमत',install:'इंस्टॉलेशन लगभग',days:'दिन'}};
let L='en';const t=k=>T[L][k]||T.en[k]||k;
/* ---------- engine (mirrors engine/recommender.py + engine/kyc.py) ---------- */
function eligible(p,prof,ids){if(!p.tiers.includes(prof.tier))return[false,L=='hi'?`Tier-${prof.tier} शहरों में उपलब्ध नहीं`:`not sold in Tier-${prof.tier} cities`];
 if(prof.employees<p.min_employees)return[false,L=='hi'?`${p.min_employees}+ कर्मचारियों के लिए`:`for businesses with ${p.min_employees}+ staff`];
 if(prof.sites<p.min_sites)return[false,L=='hi'?`${p.min_sites}+ जगहों के लिए`:`for ${p.min_sites}+ locations`];
 if(p.requires_gstin=='Y'&&!prof.gst)return[false,L=='hi'?'चालू GSTIN ज़रूरी है':'needs an active GSTIN'];
 if(p.need_one.length&&!p.need_one.some(x=>ids.includes(x)))return[false,L=='hi'?'पहले इंटरनेट प्लान चाहिए':'needs an internet plan first'];return[true,''] }
const WANT={whatsapp:['P15',e=>1],sms:['P14',e=>1],email:['P16',e=>e],storage:['P17',e=>1],pos:['P19',e=>1],cctv:['P23',e=>2],security:['P20',e=>e],wifi:['P22',e=>1],website:['P18',e=>1],failover:['P09',e=>1],telephony:['P12',e=>1],tollfree:['P13',e=>1],iot:['P24',e=>Math.max(1,e/10|0)],fleet:['P25',e=>Math.max(1,e/10|0)],firewall:['P21',e=>1],sdwan:['P10',e=>1]};
function pickNet(prof){const e=prof.employees;const o=e>=150?['P06']:e>=50?['P05']:(e>=15&&prof.tier==1)?['P03']:e>=5?['P02']:['P01'];for(const id of[...o,'P02','P01'])if(eligible(CAT[id],prof,[])[0])return id;return'P01'}
function recommend(prof,wants){const items=[],ex=[],ids=[];
 const add=(pid,qty,why)=>{const[ok,r]=eligible(CAT[pid],prof,ids);if(ok){items.push({pid,qty,why});ids.push(pid)}else ex.push({pid,reason:r})};
 const net=pickNet(prof);add(net,prof.sites,L=='hi'?`${prof.employees} लोगों के लिए सही स्पीड`:`Right-sized for ${prof.employees} staff`+(prof.sites>1?` across ${prof.sites} sites`:''));
 if(prof.sims)add(prof.employees>=5?'P08':'P07',prof.sims,L=='hi'?'सारे सिम एक बिल में':'Business SIMs on one bill');
 wants.forEach(w=>{if(WANT[w]){const[pid,q]=WANT[w];add(pid,CAT[pid].unit.startsWith('per site')?prof.sites:q(prof.employees),CAT[pid].product_name)}});return{items,ex}}
const price=(p,c)=>{const f={12:1,24:.5,36:0}[c]??1;return Math.round(p.price_min_inr_per_month+(p.price_max_inr_per_month-p.price_min_inr_per_month)*f)};
const setupOf=i=>CAT[i.pid].one_time_setup_inr*(CAT[i.pid].unit.startsWith('per site')?i.qty:1);
/* GSTIN */
const CH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gchk(s){let tot=0;for(let i=0;i<14;i++){const v=CH.indexOf(s[i])*(i%2?2:1);tot+=Math.floor(v/36)+v%36}return CH[(36-tot%36)%36]}
const gvalid=g=>!!g&&/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)&&gchk(g)==g[14];
const CONF={O:'0','0':'O',I:'1','1':'I',S:'5','5':'S',B:'8','8':'B',Z:'2','2':'Z',G:'6','6':'G'};
function grepair(g){if(gvalid(g))return[g,false];if(!g||g.length!=15)return[g,false];for(let i=0;i<15;i++){const c=CONF[g[i]];if(c){const x=g.slice(0,i)+c+g.slice(i+1);if(gvalid(x))return[x,true]}}return[g,false]}
const PAIRS=new Set(['O0','I1','IT','IJ','S5','B8','Z2','G6','58','UV','DO','QO','Q0'].flatMap(p=>[p,p[1]+p[0]]));
function grepairReg(g){if(!g||g.length!=15)return[g,false];const hits=[];for(const c of GST.keys()){let d=0,ok=true;for(let i=0;i<15;i++)if(g[i]!=c[i]){d++;if(!PAIRS.has(g[i]+c[i])){ok=false;break}}if(ok&&d>0&&d<=3&&gvalid(c))hits.push(c)}return hits.length==1?[hits[0],true]:[g,false]}
/* fuzzy */
const norm=s=>(s||'').toLowerCase().replace(/\(prop\.?,?\s*/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).join(' ');
function ratio(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;/* Ratcliff-Obershelp like difflib */const m=(x,y)=>{if(!x.length||!y.length)return 0;let best=0,bi=0,bj=0;const dp=new Array(y.length+1).fill(0);for(let i=1;i<=x.length;i++){let prev=0;for(let j=1;j<=y.length;j++){const tmp=dp[j];dp[j]=x[i-1]==y[j-1]?prev+1:0;if(dp[j]>best){best=dp[j];bi=i;bj=j}prev=tmp}}if(!best)return 0;return best+m(x.slice(0,bi-best),y.slice(0,bj-best))+m(x.slice(bi),y.slice(bj))};return 2*m(a,b)/(a.length+b.length)}
const mask=(v,k=4)=>v?'•'.repeat(Math.max(v.length-k,0))+v.slice(-k):v;
const NEED={gst_certificate:5,udyam_certificate:5,signatory_id:5,address_proof:3};
const DL={gst_certificate:'GST certificate',udyam_certificate:'Udyam certificate',signatory_id:'Signatory ID',address_proof:'Address proof'};
function validate(docs){const F=[];const add=(sev,code,doc,msg,fix)=>F.push({sev,code,doc,msg,fix});
 const f={};for(const k in DL)f[k]=docs[k]?docs[k].fields:{};
 for(const k in DL){const d=docs[k];if(!d){add('BLOCK','DOC_MISSING',k,`${DL[k]} was not uploaded.`,`Upload your ${DL[k]}.`);continue}
  const found=Object.keys(d.fields).filter(x=>x!='address').length,need=NEED[k];
  if(found<need-1||(k=='gst_certificate'&&!d.fields.gstin&&found<need))if(d.meta.blur<200||found<need-1)add('BLOCK','DOC_UNREADABLE',k,`We couldn't read your ${DL[k]} clearly (photo looks blurry or tilted).`,'Retake the photo in good light, flat on a table, all four corners visible.')}
 let gs=f.gst_certificate.gstin,g=null;
 if(gs){let[fx,rep]=grepair(gs);if(!gvalid(fx))[fx,rep]=grepairReg(gs);
  if(!gvalid(fx))add('BLOCK','GSTIN_INVALID','gst_certificate',`GSTIN ${mask(gs)} fails the format/checksum test.`,'Check the number on your certificate.');
  else{if(rep)add('INFO','GSTIN_OCR_FIXED','gst_certificate','We auto-corrected look-alike characters misread from the photo; please confirm your GSTIN on screen.');gs=fx;f.gst_certificate.gstin=fx;g=GST.get(fx);
   if(!g)add('BLOCK','GSTIN_NOT_FOUND','gst_certificate',`GSTIN ${mask(fx)} is not in the GST registry.`,'Re-enter your GSTIN or contact your CA.');
   else{if(g.status!='Active')add('BLOCK','GSTIN_NOT_ACTIVE','gst_certificate',`GSTIN is ${g.status} in the registry. Products that need GST can't be sold.`,"Choose products that don't need GST, or reactivate your GSTIN.");
    if(ratio(g.legal,f.gst_certificate.legal_name||'')<.8)add('BLOCK','GST_NAME_MISMATCH','gst_certificate',`Legal name on certificate ('${f.gst_certificate.legal_name}') differs from registry ('${g.legal}').`,'Upload the latest certificate.')}}}
 else if(docs.gst_certificate){const tn=f.gst_certificate.trade_name;if(tn){for(const[k,v]of GST)if(ratio(v.trade,tn)>.92){add('REVIEW','GSTIN_SUGGEST','gst_certificate',`GSTIN unreadable. Is your GSTIN ${mask(k,5)}? (${v.trade})`,'Confirm or type your GSTIN.');break}}}
 const un=f.udyam_certificate.udyam_number;
 if(docs.udyam_certificate&&!un)add('BLOCK','UDYAM_NUMBER_MISSING','udyam_certificate','No Udyam registration number found on the certificate.','Upload the full Udyam certificate showing the number.');
